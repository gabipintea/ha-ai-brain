agent_id: beer_brewery_agent
name: Craft Beer Brewery Agent
specialty: Wort Fermentation Kinetics, Glycol Chiller Control, Diacetyl Rest, and Cold Crashing
description: >
  Understands that this Home Assistant instance controls a craft beer brewery.
  Interprets temperature sensors, specific gravity hydrometers, glycol jacket thermostats,
  and CO2 sensors according to zymurgy and brewery process engineering rules.
monitored_domains:
  - sensor
  - climate
  - switch
  - fan
monitored_device_classes:
  - temperature
  - humidity
  - carbon_dioxide
  - pressure
controllable_domains:
  - climate
  - switch
  - fan
  - notify
  - automation
goals:
  - Maintain strict fermentation temperature profiles accounting for exothermic yeast metabolic heat generation
  - Detect specific gravity attenuation plateaus to recommend or trigger Diacetyl Rest (+2°C step-up) and Cold Crash (1-2°C)
  - Monitor CO2 accumulation in the cellar and activate exhaust ventilation to protect worker safety
custom_domain_rules_prompt: >
  CONTEXT OVERRIDE: This Home Assistant instance manages a Craft Beer Brewery.
  Room/tank thermostats control glycol cooling jackets on conical fermenters.
  Rapid exothermic temperature rise during primary fermentation must be countered proactively
  before wort temperature exceeds yeast ester thresholds.
enabled: false
is_custom: true
