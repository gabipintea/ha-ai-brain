name: "HA AI Brain"
version: "0.1.12"
slug: "ha_ai_brain"
description: "Autonomous Multi-Agent AI Brain for Home Assistant (Climate, Lighting, Security, Repair, and Custom Domain Agents)"
url: "https://github.com/gabipintea/ha-ai-brain"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:brain"
panel_title: "AI Brain"
homeassistant_api: true
hassio_api: true
hassio_role: manager
map:
  - data:rw
  - config:rw
options:
  operating_mode: "hybrid"
  default_autonomy_level: "copilot"
  llm_provider: "gemini/gemini-3.8-flash"
  llm_fast_model: "gemini/gemini-3.5-flash"
  llm_api_key: ""
  site_context: ""
  enable_actionable_notifications: true
  notification_service: "notify.notify"
  batch_analysis_interval_minutes: 360
  batch_lookback_hours: 24
schema:
  operating_mode: "list(realtime_stream|periodic_batch|hybrid)"
  default_autonomy_level: "list(shadow|copilot|autonomous)"
  llm_provider: "str"
  llm_fast_model: "str"
  llm_api_key: "password?"
  site_context: "str?"
  enable_actionable_notifications: "bool"
  notification_service: "str"
  batch_analysis_interval_minutes: "int(15,10080)"
  batch_lookback_hours: "int(1,168)?"
