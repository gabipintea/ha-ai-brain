[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-ai-brain"
version = "0.2.11"
description = "Autonomous Multi-Agent Cognitive Brain for Home Assistant (Hexagonal Architecture + LangGraph)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Gabriel Pintea" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "litellm>=1.40.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ha-ai-brain = "ha_ai_brain.main:run"

[tool.setuptools.packages.find]
where = ["ha_ai_brain/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["ha_ai_brain/src"]
